<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist FPV Drone Animation</title>
    <!-- Import IBM Plex Mono to match the senior's exact font -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #111111;
            /* Removed the glowing border for a cleaner look */
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <canvas id="quadCanvas" width="520" height="200"></canvas>

    <script>
        const canvas = document.getElementById('quadCanvas');
        const ctx = canvas.getContext('2d');

        let time = 0;

        function drawMinimalText() {
            // Match the exact font, size, and letter spacing from the SVG snippet
            ctx.font = '10px "IBM Plex Mono", monospace';
            ctx.letterSpacing = "0.06em"; 
            
            // Top Left Text (Off-white)
            ctx.fillStyle = '#E7EEF8';
            ctx.fillText('FPV DRONE', 28, 30);
            
            // Middle Right Text (Muted blue-grey)
            ctx.fillStyle = '#9fb1cb';
            ctx.fillText('flight = stable', 400, 86);
            
            // Reset letter spacing so it doesn't affect anything else
            ctx.letterSpacing = "0px"; 
        }

        function drawQuadcopter() {
            const hoverY = Math.sin(time * 0.04) * 10; // Slightly smoother hover
            const tilt = Math.cos(time * 0.02) * 0.03;
            
            ctx.save();
            // Centered in the new 520x200 canvas bounds
            ctx.translate(canvas.width / 2 - 30, canvas.height / 2 + hoverY);
            ctx.rotate(tilt);

            // Turquoise for the main wireframe body
            ctx.strokeStyle = '#45E3B8';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 1. Central Body
            ctx.beginPath();
            ctx.moveTo(-35, -10);
            ctx.lineTo(35, -10);
            ctx.lineTo(25, 15);
            ctx.lineTo(-25, 15);
            ctx.closePath();
            ctx.stroke();

            // 2. Arms
            ctx.beginPath();
            ctx.moveTo(-35, -10);
            ctx.lineTo(-120, -25); 
            ctx.moveTo(35, -10);
            ctx.lineTo(120, -25);  
            ctx.stroke();

            // 3. Landing Legs
            ctx.beginPath();
            ctx.moveTo(-25, 15);
            ctx.lineTo(-35, 50); 
            ctx.lineTo(-20, 50);
            ctx.moveTo(25, 15);
            ctx.lineTo(35, 50);  
            ctx.lineTo(20, 50);
            ctx.stroke();

            // 4. FPV Camera Box
            ctx.strokeStyle = '#21405c';
            ctx.fillStyle = '#21405c';
            ctx.beginPath();
            ctx.rect(-12, 5, 24, 18);
            ctx.fill();
            ctx.stroke();
            
            // Camera Lens
            ctx.beginPath();
            ctx.arc(0, 14, 5, 0, Math.PI * 2);
            ctx.strokeStyle = '#45E3B8';
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 14, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#45E3B8';
            ctx.fill();

            // 5. Spinning Rotors
            ctx.strokeStyle = '#162f45';
            ctx.lineWidth = 2.5; 
            
            const rotorSpin = Math.cos(time * 0.8) * 45; 
            
            // Left Motor & Rotor
            ctx.beginPath();
            ctx.moveTo(-120, -25);
            ctx.lineTo(-120, -32);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(-120, -32, Math.abs(rotorSpin), 4, 0, 0, Math.PI * 2);
            ctx.stroke();

            // Right Motor & Rotor
            ctx.beginPath();
            ctx.moveTo(120, -25);
            ctx.lineTo(120, -32);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(120, -32, Math.abs(rotorSpin), 4, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function animate() {
            // Clear the frame completely (no grid or crosshairs)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawMinimalText();
            drawQuadcopter();

            time++;
            requestAnimationFrame(animate);
        }

        // Initialize
        animate();
    </script>
</body>
</html>
